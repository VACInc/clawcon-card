name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the job only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Pinned to a full commit SHA (v4.2.2) so a moved tag cannot change what runs.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Node ships with the runner image; the suite has no dependencies to install.
      - run: node --version
      - run: node --test tests/*.test.mjs
